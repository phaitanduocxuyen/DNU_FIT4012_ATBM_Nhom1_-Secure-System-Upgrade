{% extends "client_base.html" %}

{% block title %}Bảo mật - Secure Message Client{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row g-4 justify-content-center">
        <div class="col-md-5">
            <div class="card border-primary">
                <div class="card-header bg-primary text-white">
                    <i class="fas fa-lock"></i> Test AES-256-GCM Encryption
                </div>
                <div class="card-body">
                    <label for="aes-text" class="form-label">Dữ liệu test:</label>
                    <input type="text" class="form-control mb-2" id="aes-text" value="Hello Secure World!">
                    <button class="btn btn-primary w-100 mb-2" onclick="testAES()">
                        <i class="fas fa-shield-alt"></i> Mã hóa AES-GCM
                    </button>
                    <div id="aes-result"></div>
                </div>
            </div>
        </div>
        
        <div class="col-md-5">
            <div class="card border-success">
                <div class="card-header bg-success text-white">
                    <i class="fas fa-key"></i> Test RSA-PSS Signature
                </div>
                <div class="card-body">
                    <label for="rsa-text" class="form-label">Dữ liệu test:</label>
                    <input type="text" class="form-control mb-2" id="rsa-text" value="Hello World!">
                    <button class="btn btn-success w-100 mb-2" onclick="testRSA()">
                        <i class="fas fa-pen-nib"></i> Ký số RSA-PSS
                    </button>
                    <div id="rsa-result"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function testAES() {
    const text = document.getElementById('aes-text').value;
    const resultDiv = document.getElementById('aes-result');
    resultDiv.innerHTML = '<div class="text-info"><i class="fas fa-spinner fa-spin"></i> Đang test...</div>';
    fetch('/api/test-aes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            resultDiv.innerHTML = `
                <div class="alert alert-success">
                    <b>Original:</b> ${data.original_text}<br>
                    <b>Cipher + AuthTag (Base64):</b> <span style="word-break: break-all; font-size: 0.85em;">${data.encrypted_data.cipher}</span><br>
                    <b>Nonce (Base64):</b> ${data.encrypted_data.nonce}<br>
                    <b>Decrypted:</b> ${data.decrypted_text}<br>
                    <hr>
                    <small><i>Toàn vẹn dữ liệu được đảm bảo tự động bởi Auth Tag tích hợp trong AES-GCM.</i></small>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger"><b>Lỗi:</b> ${data.message}</div>`;
        }
    })
    .catch(e => {
        resultDiv.innerHTML = `<div class="alert alert-danger"><b>Lỗi:</b> ${e.message}</div>`;
    });
}

function testRSA() {
    const message = document.getElementById('rsa-text').value;
    const resultDiv = document.getElementById('rsa-result');
    resultDiv.innerHTML = '<div class="text-info"><i class="fas fa-spinner fa-spin"></i> Đang test...</div>';
    fetch('/api/test-rsa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            resultDiv.innerHTML = `
                <div class="alert alert-success">
                    <b>Original:</b> ${data.original_message}<br>
                    <b>Signature Valid:</b> ${data.verification_result ? 'Yes' : 'No'}<br>
                    <b>Tampered Verification:</b> ${data.tampered_verification ? 'Yes' : 'No'}<br>
                    <hr>
                    <small><i>Sử dụng chuẩn Padding RSA-PSS an toàn hơn.</i></small>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger"><b>Lỗi:</b> ${data.message}</div>`;
        }
    })
    .catch(e => {
        resultDiv.innerHTML = `<div class="alert alert-danger"><b>Lỗi:</b> ${e.message}</div>`;
    });
}
</script>
{% endblock %}
